spring:
  config:
    import:
      - aws-parameterstore:/
  cloud:
    aws:
      region:
        static: ap-southeast-2
  datasource:
    url: ${url}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${username}
    password: ${password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  team-name: ${team-name:default-team}
logging:
  level:
    com.member: INFO
    io.awspring.cloud: TRACE
    org.springframework.boot.context.config: TRACE